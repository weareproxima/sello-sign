openapi: 3.1.0
info:
  title: Sello Sign API
  version: 1.0.0
  summary: Firma y verificación de documentos tributarios electrónicos.
  description: |
    El contrato del API de Sello Sign. Su forma está en `contracts/README.md`;
    este archivo es el detalle, y los dos cambian juntos.

    - JSON en `snake_case`; los ids son UUIDv7 en texto.
    - Los errores son `application/problem+json` (RFC 9457) con `type` (un slug
      estable), `title`, `status` y `detail`. La única excepción es el `404`
      del empuje de billing, cuyo `type` es la URI que billing ya reconoce.
    - Los límites del plan se aplican al firmar, en el espacio que firma:
      `429 rate-limited` y `429 monthly-limit-reached`, con `Retry-After` y
      las cabeceras `X-RateLimit-*` (ver `Limits`).
    - Toda lista responde `{ "items": [...], "next_cursor": "…" | null }`.
      Las que crecen (organizaciones, claves, registro de firmas, registro
      de actividad) se paginan con `?limit=` (1 a 100, 50 por defecto) y
      `?cursor=`; las demás
      (miembros, certificados, delegaciones…) van enteras, con
      `next_cursor: null`.
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: https://api.sign.sello.tax
  - url: http://127.0.0.1:4441
tags:
  - name: Firma
  - name: Espacios
  - name: Organizaciones
  - name: Certificados
  - name: Delegaciones
  - name: Claves
  - name: Registro
  - name: Actividad
  - name: Billing
  - name: MCP
  - name: Sistema
security:
  - apiKey: []
  - panelToken: []

paths:
  /signatures:
    post:
      tags: [Firma]
      operationId: sign
      summary: Firmar un documento
      description: |
        Firma el documento tal cual llega con el certificado activo del
        ambiente de la clave. Lo firmado cuenta en el espacio de la clave,
        también cuando la organización es de otro espacio y se firma por
        delegación, y ahí se aplican los límites: las firmas por minuto de
        la clave y del espacio (`429 rate-limited`) y las del mes del plan
        del espacio en el ambiente (`429 monthly-limit-reached`).
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: El DTE de El Salvador.
          application/xml:
            schema:
              type: string
              description: El comprobante de los demás países.
      responses:
        '200':
          description: Firmado.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            X-RateLimit-Remaining:
              { $ref: '#/components/headers/RateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Signed' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/LimitReached' }
        '409':
          description: |
            `country-not-enabled` (el país de la organización no se ofrece),
            `certificate-not-active` (sin certificado activo en el ambiente),
            `certificate-expired` o `organization-ambiguous` (el NIT nombra a
            más de una organización).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422':
          description: '`invalid-document`: el cuerpo no es un documento que el país firme.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '501':
          description: '`country-not-implemented`: el firmador del país todavía no existe.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /verifications:
    post:
      tags: [Firma]
      operationId: verify
      summary: Verificar una firma
      description: |
        Verifica una firma con el certificado activo de la organización en un
        ambiente, también si ya venció (verifica lo que firmó mientras valía).
        No guarda nada: ni el documento ni el resultado, y no cuenta en el
        uso.

        - Con una clave con `sign`: entre las organizaciones que alcanza, en
          el ambiente de la clave (`environment`, si va, es ese).
        - Con el token del panel: cualquier miembro, de cualquier rol, de un
          espacio dueño de la organización o al que se le delegó con `sign`
          o `certificates:read`, en el ambiente que dice `environment`
          (obligatorio). `X-Organization-Id` se busca entre las
          organizaciones de todos los espacios de la persona: un NIT que
          nombra a más de una es `409 organization-ambiguous`.
      security:
        - apiKey: []
        - panelToken: []
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signature]
              properties:
                signature:
                  type: string
                  description: El JWS (El Salvador) o el XML firmado.
                environment:
                  $ref: '#/components/schemas/Environment'
                  description: Obligatorio con el token; con una clave, el suyo o nada.
      responses:
        '200':
          description: El resultado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Verification' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }

  /me:
    get:
      tags: [Espacios]
      operationId: getMe
      summary: La persona y sus espacios
      security:
        - panelToken: []
      responses:
        '200':
          description: La persona.
          content:
            application/json:
              schema:
                type: object
                required: [user, workspaces]
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  workspaces:
                    type: array
                    items: { $ref: '#/components/schemas/WorkspaceSummary' }
        '401': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Espacios]
      operationId: deleteMe
      summary: Borrar lo que el API guarda de la persona (instalación propia)
      description: |
        Lo llama el panel antes de borrar la cuenta. La persona sale de sus
        espacios, y los espacios de los que era el único miembro se borran
        con todo lo suyo (organizaciones, certificados, delegaciones, claves,
        invitaciones, registro y uso). Lo que hizo en los espacios que quedan
        se queda: es de ellos. Si es el único propietario de un espacio con
        otros miembros, o el único miembro de uno cuyas organizaciones usan
        otros espacios por delegación, es `409 account-has-workspaces` y no
        cambia nada (`GET /me/account-deletion` dice cuál). En la nube no
        existe (`404 not-self-hosted`): la cuenta se borra escribiendo a
        Sello.
      security:
        - panelToken: []
      responses:
        '204': { description: Borrado. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404':
          description: '`not-self-hosted`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`account-has-workspaces`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /me/account-deletion:
    get:
      tags: [Espacios]
      operationId: getAccountDeletion
      summary: Qué haría borrar la cuenta (instalación propia)
      description: |
        Qué le pasaría a cada espacio de la persona si borrara su cuenta
        ahora, para que lo vea antes de confirmarlo. En la nube,
        `404 not-self-hosted`.
      security:
        - panelToken: []
      responses:
        '200':
          description: Lo que pasaría.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDeletion' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /me/sello-organizations:
    get:
      tags: [Espacios]
      operationId: listSelloOrganizations
      summary: Las organizaciones del IdP de la persona (nube)
      description: |
        Las organizaciones que dice el token (`sello_workspaces`), cada una con
        lo que la persona puede hacer con ella aquí. Fuera de la nube, `404`.
      security:
        - panelToken: []
      responses:
        '200':
          description: Las organizaciones.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SelloOrganization' }
                  next_cursor: { type: 'null' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /workspaces:
    post:
      tags: [Espacios]
      operationId: createWorkspace
      summary: Crear o abrir un espacio
      description: |
        En una instalación propia, `{ "name", "default_country" }`: crea un
        espacio y quien lo crea es su `owner`. En la nube,
        `{ "sello_workspace_id" }`: abre el espacio de esa organización del IdP
        (lo crea la primera vez quien la administra; después lo abre cualquiera
        de sus miembros, mientras el plan los admita). `201` si se creó, `200`
        si ya existía.
      security:
        - panelToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  title: Instalación propia
                  required: [name]
                  properties:
                    name: { type: string, minLength: 1, maxLength: 120 }
                    default_country: { $ref: '#/components/schemas/Country' }
                - type: object
                  title: Nube
                  required: [sello_workspace_id]
                  properties:
                    sello_workspace_id: { type: string }
      responses:
        '200':
          description: El espacio ya existía.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '201':
          description: Creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403':
          description: '`ask-admin`: solo quien administra la organización del IdP abre su espacio la primera vez; `forbidden`: no es una organización de la persona.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`workspace-full`: el plan no admite a la persona; `sello-organization-unknown`: billing todavía no conoce la organización.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '410':
          description: '`sello-organization-closed`: la organización se borró en el IdP.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: '`billing-unavailable`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /workspaces/{workspace_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Espacios]
      operationId: getWorkspace
      summary: Un espacio
      responses:
        '200':
          description: El espacio.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Espacios]
      operationId: updateWorkspace
      summary: Cambiar un espacio
      description: |
        Solo `owner` o `admin`, con el token. En la nube, el nombre es el de
        la organización del IdP, y billing lo reemplaza en su próximo empuje.
        `requests_per_minute` es el límite de firmas por minuto que el
        espacio se pone, nunca por encima del de su plan
        (`limits.requests_per_minute`; si lo pasa, `400 invalid-request`);
        `null` lo quita, y vale el del plan.
      security:
        - panelToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                default_country:
                  oneOf:
                    - $ref: '#/components/schemas/Country'
                    - type: 'null'
                requests_per_minute:
                  type: [integer, 'null']
                  minimum: 1
                  maximum: 1000000
      responses:
        '200':
          description: El espacio.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Espacios]
      operationId: deleteWorkspace
      summary: Borrar un espacio
      description: |
        Solo un `owner`, con el token (una clave, `403 forbidden`). El cuerpo
        lleva el nombre del espacio, tal como está (los blancos al principio
        y al final no cuentan), para que no se borre uno por error: otro
        texto, o sin él, es `400 confirmation-mismatch`.

        Se borra, en una transacción, con todo lo suyo: sus organizaciones,
        con sus certificados (el material cifrado y sus datos), sus
        delegaciones y las claves de API de una sola de ellas, también las de
        otro espacio; sus miembros, sus invitaciones, las delegaciones que
        otros espacios le dieron, sus claves (que dejan de valer al momento),
        su registro de firmas y su uso. Lo que otros espacios firmaron con
        sus organizaciones se queda en el registro y el uso de esos espacios.

        Mientras otro espacio use una de sus organizaciones por delegación,
        `409 workspace-has-delegations`, y no cambia nada: se quitan antes.
        Las organizaciones de las que el espacio de la plataforma de Sello
        tiene la delegación `locked` vuelven antes a él, con sus certificados
        y su historial, como al cerrar un espacio. El espacio de la
        plataforma no se borra (`409 platform-workspace`), ni, en la nube, el
        de una organización del IdP (`sello_workspace_id`), cuyo plan y
        miembros empuja billing y que se cierra cuando Sello elimina esa
        organización (`409 workspace-managed-by-sello`).
      security:
        - panelToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  description: El nombre del espacio.
      responses:
        '204': { description: Borrado. }
        '400':
          description: '`confirmation-mismatch` o `invalid-request`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: '`workspace-has-delegations`, `platform-workspace` o `workspace-managed-by-sello`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /workspaces/{workspace_id}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Espacios]
      operationId: listMembers
      summary: Los miembros de un espacio
      security:
        - panelToken: []
      responses:
        '200':
          description: Los miembros.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
                  next_cursor: { type: 'null' }
        '404': { $ref: '#/components/responses/Problem' }
  /workspaces/{workspace_id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: user_id
        in: path
        required: true
        description: El usuario del panel (`user_id` del miembro).
        schema: { type: string }
    patch:
      tags: [Espacios]
      operationId: updateMember
      summary: Cambiar el rol de un miembro
      description: |
        Con el token, `owner` o `admin`. Solo un `owner` da o quita el rol
        `owner`, y el espacio nunca se queda sin uno: cambiar al último es
        `409 last-owner`. Solo los miembros que se agregaron en Sign; en un
        espacio de una organización del IdP (`sello_workspace_id`), los
        miembros son los asientos que empuja billing y cambian en el centro
        de cuenta de Sello: `409 members-managed-by-sello`.
      security:
        - panelToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: El miembro, con su rol nuevo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404':
          description: '`workspace-not-found` o `member-not-found`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`last-owner` o `members-managed-by-sello`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Espacios]
      operationId: removeMember
      summary: Quitar a un miembro, o salir del espacio
      description: |
        Con el token. `owner` y `admin` quitan a otros; solo un `owner`
        quita a otro `owner`. Cualquier miembro sale por sí mismo con su
        propio `user_id`. El espacio nunca se queda sin propietario: quitar
        al último es `409 last-owner`. Lo del espacio se queda (las claves
        que creó, las invitaciones que mandó, sus firmas en el registro).
        Solo los miembros que se agregaron en Sign; en un espacio de una
        organización del IdP, `409 members-managed-by-sello`.
      security:
        - panelToken: []
      responses:
        '204': { description: Quitado. }
        '403': { $ref: '#/components/responses/Problem' }
        '404':
          description: '`workspace-not-found` o `member-not-found`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`last-owner` o `members-managed-by-sello`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /workspaces/{workspace_id}/export:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Espacios]
      operationId: exportWorkspace
      summary: Exportar los datos del espacio
      description: |
        Con el token, `owner` o `admin`. Un JSON hecho al momento, que no se
        guarda en ningún lado (`Content-Disposition: attachment`): el
        espacio, sus organizaciones (las propias y las delegadas) con los
        datos públicos de sus certificados (nunca el material ni el PIN) y
        sus delegaciones, sus claves (también las revocadas, nunca su hash),
        sus miembros, sus invitaciones abiertas (nunca su token), su uso, su
        registro de actividad y su registro de firmas tal como están, dentro
        de su retención. Los dos registros van al final y se escriben a
        medida que se leen; si falla a medias, la descarga se corta. La
        exportación queda en el registro de actividad
        (`workspace.exported`) antes de enviarse.
      security:
        - panelToken: []
      responses:
        '200':
          description: La exportación.
          headers:
            Content-Disposition:
              schema:
                {
                  type: string,
                  example: 'attachment; filename="sello-sign-0193…-2026-11-20.json"',
                }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceExport' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /workspaces/{workspace_id}/invitations:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Espacios]
      operationId: listInvitations
      summary: Las invitaciones abiertas del espacio
      description: |
        Con el token, `owner` o `admin`. Las que nadie aceptó ni se
        revocaron, también las vencidas (`status: expired`), de la más nueva
        a la más antigua.
      security:
        - panelToken: []
      responses:
        '200':
          description: Las invitaciones.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Invitation' }
                  next_cursor: { type: 'null' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Espacios]
      operationId: createInvitation
      summary: Invitar a alguien por correo
      description: |
        Con el token, `owner` o `admin`; solo un `owner` invita a otro
        `owner`. Vale 7 días y se acepta una sola vez
        (`POST /invitation-acceptances`). Responde el `token`, que no se
        vuelve a mostrar: el panel lo pone en el enlace del correo que
        manda. El API guarda solo su SHA-256. Un correo con una invitación
        vencida recibe otra en su lugar.
      security:
        - panelToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '201':
          description: La invitación, con `token`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Invitation'
                  - type: object
                    required: [token]
                    properties:
                      token: { type: string, example: sign_inv_7Hq2… }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: |
            `already-member`, `invitation-exists` (ese correo ya tiene una
            invitación pendiente), `workspace-full` (el plan no admite más
            miembros) o `members-managed-by-sello` (un espacio de una
            organización del IdP).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /workspaces/{workspace_id}/invitations/{invitation_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: invitation_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Espacios]
      operationId: revokeInvitation
      summary: Revocar una invitación
      description: Con el token, `owner` o `admin`. Su enlace deja de valer al momento.
      security:
        - panelToken: []
      responses:
        '204': { description: Revocada. }
        '403': { $ref: '#/components/responses/Problem' }
        '404':
          description: '`workspace-not-found` o `invitation-not-found`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`members-managed-by-sello`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /workspaces/{workspace_id}/invitations/{invitation_id}/renewals:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: invitation_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Espacios]
      operationId: renewInvitation
      summary: Renovar una invitación, para reenviarla
      description: |
        Con el token, `owner` o `admin`; solo un `owner` renueva la de un
        `owner`. La misma invitación (su id, su correo y su rol), vencida o
        no, con un `token` nuevo y 7 días desde ahora: el enlace anterior
        deja de valer. Responde el `token` una sola vez, como al crearla; el
        panel manda el correo otra vez. Valen las comprobaciones de crearla.
      security:
        - panelToken: []
      responses:
        '200':
          description: La invitación, con `token`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Invitation'
                  - type: object
                    required: [token]
                    properties:
                      token: { type: string, example: sign_inv_7Hq2… }
        '403': { $ref: '#/components/responses/Problem' }
        '404':
          description: '`workspace-not-found` o `invitation-not-found` (también una aceptada o revocada).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`already-member`, `workspace-full` o `members-managed-by-sello`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /invitation-lookups:
    post:
      tags: [Espacios]
      operationId: lookupInvitation
      summary: Lo que dice una invitación
      description: |
        Con el token de la persona que abrió el enlace, antes de aceptarla:
        el espacio, el correo al que se envió, el rol y su estado. Una
        revocada o un token que no es de una invitación es
        `404 invitation-not-found`.
      security:
        - panelToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationToken' }
      responses:
        '200':
          description: La invitación.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationLookup' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /invitation-acceptances:
    post:
      tags: [Espacios]
      operationId: acceptInvitation
      summary: Aceptar una invitación
      description: |
        Con el token de la persona, cuyo `email` tiene que ser el de la
        invitación (sin importar mayúsculas). Entra al espacio con el rol de
        la invitación; quien ya estaba conserva el suyo. Aceptarla otra vez
        con la misma cuenta responde lo mismo.
      security:
        - panelToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationToken' }
      responses:
        '200':
          description: El espacio, con el rol de la persona.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '403':
          description: '`invitation-email-mismatch`: la invitación es para otro correo.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: '`invitation-not-found`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`workspace-full`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '410':
          description: '`invitation-expired` o `invitation-used` (otra cuenta ya la aceptó).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /workspaces/{workspace_id}/usage:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Espacios]
      operationId: getUsage
      summary: Lo que firmó el espacio, por mes y ambiente
      description: Lo que firmaron las claves y las personas del espacio, también con organizaciones delegadas. Pide `logs:read`.
      parameters:
        - name: from
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
          description: El primer mes (AAAA-MM); por defecto, once meses antes del actual.
        - name: to
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
          description: El último mes (AAAA-MM); por defecto, el actual (UTC).
      responses:
        '200':
          description: El uso.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usage' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspace_id}/organizations:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Organizaciones]
      operationId: listOrganizations
      summary: Las organizaciones del espacio y las que tiene delegadas
      description: Pide `organizations:read`. Una clave de una sola organización ve solo esa.
      parameters:
        - name: relation
          in: query
          schema: { type: string, enum: [owned, delegated] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Las organizaciones, de la más nueva a la más antigua.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Organization' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Organizaciones]
      operationId: createOrganization
      summary: Crear una organización
      description: |
        Pide `organizations:write`. Idempotente por espacio, país y NIT (sin
        guiones, espacios ni puntos): si ya existe, `200` con la que hay.
        `sello_workspace_id` solo lo pone el espacio de la plataforma o una
        persona que administra esa organización del IdP, y es único
        (`409 sello-workspace-linked`). En el orden inverso, cuando el espacio
        de la plataforma nombra uno que ya vincula una organización del
        espacio de una empresa, `200` con esa organización
        (`relation: delegated`): la plataforma se da, si no la tiene, la
        delegación `locked` (`sign`, `certificates:read`,
        `certificates:write`), y no se crea una segunda; si esa organización
        tiene otro NIT u otro país que los pedidos, `409 organization-mismatch`.
        Una nueva que pasaría las organizaciones del plan del espacio
        (`limits.organizations`) es `409 organization-limit-reached`.
        Desde cualquier otro
        espacio sigue siendo `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationInput' }
      responses:
        '200':
          description: Ya existía en el espacio o, para el de la plataforma, en el de una empresa, ahora delegada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '201':
          description: Creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          description: '`sello-workspace-linked`, `organization-mismatch` u `organization-limit-reached`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /workspaces/{workspace_id}/organizations/{organization_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Organizaciones]
      operationId: getOrganization
      summary: Una organización
      responses:
        '200':
          description: La organización.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Organizaciones]
      operationId: updateOrganization
      summary: Cambiar una organización
      description: Solo su dueño, con `organizations:write`. El país y el NIT no cambian.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                contact_email: { type: [string, 'null'], format: email }
                sello_workspace_id: { type: [string, 'null'] }
      responses:
        '200':
          description: La organización.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Organizaciones]
      operationId: deleteOrganization
      summary: Borrar una organización
      description: Solo su dueño. Con delegaciones vivas, `409 organization-has-delegations`.
      responses:
        '204': { description: Borrada. }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /workspaces/{workspace_id}/organizations/{organization_id}/signatures:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Firma]
      operationId: signFromPanel
      summary: Firmar de prueba desde el panel
      description: Lo mismo que `POST /signatures`, con el token del panel, y con los límites del espacio (sin los de una clave). Un `member` firma solo en `test`.
      security:
        - panelToken: []
      parameters:
        - name: environment
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Environment' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
          application/xml:
            schema: { type: string }
      responses:
        '200':
          description: Firmado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Signed' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/LimitReached' }
        '501': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspace_id}/organizations/{organization_id}/certificates:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Certificados]
      operationId: listCertificates
      summary: Los certificados de una organización
      description: Pide `certificates:read` y, si la organización está delegada, que la delegación lo dé.
      responses:
        '200':
          description: Los certificados, del más nuevo al más antiguo.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Certificate' }
                  next_cursor: { type: 'null' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Certificados]
      operationId: uploadCertificate
      summary: Subir un certificado
      description: |
        Pide `certificates:write` y, si la organización está delegada, que la
        delegación lo dé. El país lee el archivo; su NIT, si lo trae, tiene
        que ser el de la organización. Activarlo desactiva el otro activo del
        mismo ambiente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [environment, file]
              properties:
                environment: { $ref: '#/components/schemas/Environment' }
                file:
                  {
                    type: string,
                    contentEncoding: base64,
                    description: El archivo,
                    en base64.,
                  }
                password: { type: string, description: El PIN de un PKCS#12. }
                activate: { type: boolean, default: true }
      responses:
        '201':
          description: Subido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certificate' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422':
          description: '`invalid-certificate` o `certificate-tax-id-mismatch`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
  /workspaces/{workspace_id}/organizations/{organization_id}/certificates/{certificate_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/OrganizationId'
      - name: certificate_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Certificados]
      operationId: updateCertificate
      summary: Activar o desactivar un certificado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        '200':
          description: El certificado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certificate' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Certificados]
      operationId: deleteCertificate
      summary: Borrar un certificado
      responses:
        '204': { description: Borrado. }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspace_id}/organizations/{organization_id}/delegations:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Delegaciones]
      operationId: listDelegations
      summary: Las delegaciones de una organización
      description: Solo su dueño, con `delegations:read`.
      responses:
        '200':
          description: Las delegaciones.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Delegation' }
                  next_cursor: { type: 'null' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Delegaciones]
      operationId: createDelegation
      summary: Delegar una organización a otro espacio
      description: Solo su dueño, con `delegations:write`. Una por espacio (`409 delegation-exists`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id, scopes]
              properties:
                workspace_id: { type: string, format: uuid }
                scopes:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/DelegationScope' }
      responses:
        '201':
          description: Creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delegation' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /workspaces/{workspace_id}/organizations/{organization_id}/delegations/{delegation_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/OrganizationId'
      - name: delegation_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Delegaciones]
      operationId: deleteDelegation
      summary: Quitar una delegación
      description: |
        Con `delegations:write`. El dueño quita las que no están bloqueadas
        (`409 delegation-locked`); el espacio delegado (`workspace_id` del
        camino es el de la delegación) renuncia a la suya, también a una
        bloqueada: así la quita la plataforma cuando la organización deja de
        emitir con ella.
      responses:
        '204': { description: Quitada. }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspace_id}/claimable-organizations:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Organizaciones]
      operationId: listClaimableOrganizations
      summary: Las organizaciones que la persona puede traer del espacio de Sello (nube)
      description: Las del espacio de la plataforma vinculadas a organizaciones del IdP que la persona administra. Solo `owner` o `admin` del espacio.
      security:
        - panelToken: []
      responses:
        '200':
          description: Las organizaciones.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Organization' }
                  next_cursor: { type: 'null' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /workspaces/{workspace_id}/organization-claims:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Organizaciones]
      operationId: claimOrganizations
      summary: Traer organizaciones del espacio de Sello (nube)
      description: |
        Las pasa al espacio con sus certificados y su historial y deja una
        delegación bloqueada (`sign`, `certificates:read`,
        `certificates:write`) al espacio de la plataforma, todo en la misma
        transacción. Si alguna no se puede traer, no se trae ninguna.
      security:
        - panelToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_ids]
              properties:
                organization_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Las organizaciones traídas.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Organization' }
                  next_cursor: { type: 'null' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404':
          description: '`organization-not-claimable`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            `organization-exists` (el espacio ya tiene una organización con
            ese país y NIT) u `organization-limit-reached` (con ellas, el
            espacio pasaría las organizaciones de su plan: no se trae
            ninguna).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /workspaces/{workspace_id}/api-keys:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Claves]
      operationId: listApiKeys
      summary: Las claves del espacio
      description: Pide `keys:read`. Las revocadas no se listan.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Las claves.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ApiKey' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Claves]
      operationId: createApiKey
      summary: Crear una clave
      description: |
        Pide `keys:write`. Una clave que crea otra no le da más de lo que
        tiene: ni otros scopes, ni otro ambiente, ni otra organización, ni
        más firmas por minuto. `requests_per_minute` es el límite de firmas
        por minuto de la clave, que se suma al del espacio: así una
        integración no gasta el de las demás.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, environment, scopes]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                environment: { $ref: '#/components/schemas/Environment' }
                scopes:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/Scope' }
                organization_id: { type: [string, 'null'], format: uuid }
                requests_per_minute:
                  type: [integer, 'null']
                  minimum: 1
                  maximum: 1000000
      responses:
        '201':
          description: La clave, con `key`, que no se vuelve a mostrar.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiKey'
                  - type: object
                    required: [key]
                    properties:
                      key: { type: string, example: sign_test_3kq9… }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /workspaces/{workspace_id}/api-keys/{api_key_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: api_key_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Claves]
      operationId: revokeApiKey
      summary: Revocar una clave
      responses:
        '204': { description: Revocada. }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspace_id}/signatures:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Registro]
      operationId: listSignatures
      summary: El registro de firmas
      description: |
        Lo que firmó el espacio y, para sus organizaciones, lo que firmó con
        ellas otro espacio por delegación (`signed_by_workspace_id`, sin su
        `api_key_id` ni su `user_id`). Pide `logs:read`. Nunca guarda el
        documento. Cada firma se guarda los días de `limits.retention_days`
        del espacio que la hizo, también la que hizo con una organización de
        otro: después se borra del registro, y sigue contada en el uso.
      parameters:
        - name: organization_id
          in: query
          schema: { type: string, format: uuid }
        - name: environment
          in: query
          schema: { $ref: '#/components/schemas/Environment' }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Las firmas, de la más nueva a la más antigua.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SignatureEntry' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /workspaces/{workspace_id}/signatures/{signature_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: signature_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Registro]
      operationId: getSignature
      summary: Una firma del registro
      responses:
        '200':
          description: La firma.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignatureEntry' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /workspaces/{workspace_id}/audit-events:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Actividad]
      operationId: listAuditEvents
      summary: El registro de actividad del espacio
      description: |
        Quién cambió qué en el espacio: cada cambio que hace una persona (con
        el token) o una clave (también por el servidor MCP) al espacio y a lo
        que guarda (sus datos y límites, miembros, invitaciones,
        organizaciones, certificados, delegaciones y claves), lo que empuja
        billing en la nube (el plan, cerrar y reabrir), lo que hace la
        consola del servidor, y cada exportación de sus datos. No las firmas
        ni las verificaciones: las firmas están en el registro de firmas.
        Cada evento se escribe en la misma transacción que su cambio.

        Con el token, `owner` o `admin`; una clave, `403`: el registro nombra
        a personas (miembros y correos invitados), que ninguna clave lee. Por
        eso tampoco está en el servidor MCP.

        Un cambio de otro espacio a lo que este guarda (una delegación que
        le dan o le quitan, un certificado que sube a una organización suya
        quien la tiene delegada, una organización que vuelve o que se lleva)
        queda en los dos, y en este el actor es ese espacio
        (`actor.type: workspace`), nunca su persona ni su clave.

        Cada evento se guarda 365 días, sea cual sea el plan, y se borra con
        el espacio. No guarda la dirección IP ni el navegador, ni ningún
        secreto: ni claves, ni sus hashes, ni tokens, ni el material de un
        certificado, ni su PIN.
      security:
        - panelToken: []
      parameters:
        - name: action
          in: query
          description: Solo esta acción.
          schema: { $ref: '#/components/schemas/AuditAction' }
        - name: target_type
          in: query
          description: Solo lo que es de este tipo.
          schema: { $ref: '#/components/schemas/AuditTargetType' }
        - name: target_id
          in: query
          description: Solo lo que es sobre esto (`target.id`).
          schema: { type: string }
        - name: actor_type
          in: query
          schema: { $ref: '#/components/schemas/AuditActorType' }
        - name: actor_id
          in: query
          description: Solo lo que hizo esta persona (su `user_id`), esta clave o este espacio (`actor.id`).
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Los eventos, del más nuevo al más antiguo.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEvent' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/billing/organizations/{sello_workspace_id}:
    put:
      tags: [Billing]
      operationId: pushBillingState
      summary: El estado de un espacio, desde billing (nube)
      description: |
        Billing de Sello empuja el estado completo de un espacio en cada
        cambio. Se aplica solo si su `version` es mayor que la aplicada; si
        no, `204` igual. Fuera de la nube, `404`.

        Un estado cerrado deja de firmar en el espacio y, en la misma
        transacción, devuelve al espacio de la plataforma cada organización
        suya de la que la plataforma tiene la delegación `locked`, con sus
        certificados y su historial: se quitan esa delegación y las que el
        espacio había dado de ella a otros, y se revocan sus claves de solo
        esa organización. Las demás se quedan; reabrir el espacio no trae de
        vuelta las devueltas, y repetir el estado cerrado no cambia nada.
      security:
        - billingPush: []
      parameters:
        - name: sello_workspace_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillingState' }
      responses:
        '204': { description: Aplicado, o ya tenía esa versión o una mayor. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404':
          description: 'Sin espacio de esa organización: `type` es `https://sello.tax/problems/sign-unknown-organization`, y billing deja de empujarlo.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /mcp:
    post:
      tags: [MCP]
      operationId: mcp
      summary: Servidor MCP
      description: |
        El API como servidor [Model Context Protocol](https://modelcontextprotocol.io),
        para que un agente firme, verifique y consulte con herramientas: un
        mensaje JSON-RPC 2.0 por `POST` (Streamable HTTP sin estado, con el
        SDK oficial de Go), que se responde con JSON. Sin sesión: `GET` y
        `DELETE` son `405`. Las versiones del protocolo, las del SDK (de
        `2024-11-05` a `2026-07-28`).

        Pide una clave de API, en `X-API-Key` o como
        `Authorization: Bearer sign_…` (nunca el token del panel). `tools/list`
        da solo las herramientas que sus scopes permiten, y cada herramienta
        llama en el mismo proceso a su ruta de este contrato con la misma
        clave: los permisos, el alcance de la organización, los límites, los
        errores y el registro de firmas son los de esa ruta. Un error de la
        ruta llega como resultado de la herramienta (`isError`), con su
        problema en JSON y, si lo hay, `retry_after`. Las herramientas, en
        `contracts/README.md` («Servidor MCP»).
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Un mensaje JSON-RPC 2.0 de MCP.
              required: [jsonrpc, method]
              properties:
                jsonrpc: { type: string, enum: ['2.0'] }
                id: { type: [string, integer] }
                method: { type: string }
                params: { type: object }
      responses:
        '200':
          description: La respuesta JSON-RPC a una petición.
          content:
            application/json:
              schema: { type: object }
        '202': { description: Una notificación o una respuesta, aceptada. }
        '400':
          description: 'Un mensaje que no es JSON-RPC, o sin `Accept: application/json, text/event-stream`.'
        '401': { $ref: '#/components/responses/Problem' }
        '403':
          description: Una petición de un navegador desde otro origen.
    get:
      tags: [MCP]
      operationId: mcpStream
      summary: Sin flujo del servidor
      description: El servidor MCP no tiene sesiones ni abre un flujo SSE.
      security: []
      responses:
        '405': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [MCP]
      operationId: mcpSessionEnd
      summary: Sin sesión que cerrar
      description: El servidor MCP no tiene sesiones.
      security: []
      responses:
        '405': { $ref: '#/components/responses/Problem' }

  /health:
    get:
      tags: [Sistema]
      operationId: health
      summary: Salud
      security: []
      responses:
        '200':
          description: Vivo, con su base.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
        '503': { $ref: '#/components/responses/Problem' }
  /openapi.yaml:
    get:
      tags: [Sistema]
      operationId: openapi
      summary: Este contrato
      security: []
      responses:
        '200':
          description: El contrato.
          content:
            application/yaml:
              schema: { type: string }

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: '`sign_test_…` o `sign_prod_…`: el ambiente es el de su prefijo.'
    panelToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: El token del panel (better-auth, EdDSA), con `iss` = `PANEL_URL` y `aud` = `API_URL`.
    billingPush:
      type: http
      scheme: bearer
      description: '`BILLING_PUSH_TOKEN`.'

  parameters:
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      description: El id del espacio, o `self` (el de la clave).
      schema: { type: string }
    OrganizationId:
      name: organization_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrganizationHeader:
      name: X-Organization-Id
      in: header
      required: true
      description: El id de la organización o su NIT, entre las que alcanza la clave.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  responses:
    Problem:
      description: Un error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LimitReached:
      description: |
        `rate-limited`: la clave o el espacio que firma llegó a sus firmas
        por minuto (`applies_to`: `api_key` o `workspace`, y `limit`); cada
        minuto empieza de cero, y `Retry-After` dice cuántos segundos faltan.
        `monthly-limit-reached`: el espacio que firma llegó a las firmas del
        mes que su plan le deja en el ambiente (`environment`, `limit`), que
        en un plan de pago son las de su excedente; vuelven a contar el
        primer día del mes siguiente, en UTC (`resets_at`, y `Retry-After`).
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        X-RateLimit-Remaining:
          { $ref: '#/components/headers/RateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  headers:
    RetryAfter:
      description: Los segundos hasta poder volver a firmar.
      schema: { type: integer, minimum: 1 }
    RateLimitLimit:
      description: |
        Las firmas por minuto del límite más estrecho de los que aplican (el
        de la clave o el del espacio). Solo si alguno aplica.
      schema: { type: integer }
    RateLimitRemaining:
      description: Las que ese límite deja en este minuto, después de esta.
      schema: { type: integer }
    RateLimitReset:
      description: Los segundos hasta que empiece el minuto siguiente.
      schema: { type: integer }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          description: |
            Un slug estable: `unauthorized`, `forbidden`, `not-found`,
            `invalid-request`, `workspace-not-found`,
            `organization-not-found`, `organization-required`,
            `organization-ambiguous`, `organization-exists`,
            `organization-has-delegations`, `organization-not-claimable`,
            `not-organization-owner`, `sello-workspace-linked`,
            `organization-mismatch`,
            `certificate-not-found`, `certificate-not-active`,
            `certificate-expired`, `certificate-tax-id-mismatch`,
            `invalid-certificate`, `delegation-not-found`,
            `delegation-exists`, `delegation-locked`, `api-key-not-found`,
            `signature-not-found`, `country-not-enabled`,
            `country-not-implemented`, `unsupported-content-type`,
            `invalid-document`, `payload-too-large`, `workspace-closed`,
            `workspace-full`, `ask-admin`, `sello-organization-unknown`,
            `sello-organization-closed`, `billing-unavailable`,
            `member-not-found`, `members-managed-by-sello`,
            `already-member`, `last-owner`, `invitation-not-found`,
            `invitation-exists`, `invitation-expired`, `invitation-used`,
            `invitation-email-mismatch`, `rate-limited`,
            `monthly-limit-reached`, `organization-limit-reached`,
            `account-has-workspaces`, `confirmation-mismatch`,
            `workspace-has-delegations`, `platform-workspace`,
            `workspace-managed-by-sello`, `not-cloud`, `not-self-hosted`,
            `internal`.
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        limit:
          type: integer
          description: 'En los de los límites: el que se alcanzó.'
        applies_to:
          type: string
          enum: [api_key, workspace]
          description: 'En `rate-limited`: de quién es el límite.'
        environment:
          $ref: '#/components/schemas/Environment'
          description: 'En `monthly-limit-reached`: el ambiente.'
        resets_at:
          type: string
          format: date-time
          description: 'En `monthly-limit-reached`: cuándo vuelve a contar, el primer día del mes siguiente (UTC).'

    NextCursor:
      type: [string, 'null']
    Environment:
      type: string
      enum: [test, prod]
    Country:
      type: string
      pattern: '^[A-Z]{2}$'
      description: ISO 3166-1 alfa-2.
    Role:
      type: string
      enum: [owner, admin, member]
    Scope:
      type: string
      enum:
        - sign
        - organizations:read
        - organizations:write
        - certificates:read
        - certificates:write
        - delegations:read
        - delegations:write
        - keys:read
        - keys:write
        - logs:read
    DelegationScope:
      type: string
      enum: [sign, certificates:read, certificates:write]
    Signed:
      type: object
      required: [signature, document_id, document_type]
      properties:
        signature: { type: string, description: El JWS o el XML firmado. }
        document_id: { type: string }
        document_type: { type: string }
    Verification:
      type: object
      required: [valid, document, document_id, document_type]
      properties:
        valid: { type: boolean }
        document:
          type: [string, 'null']
          description: El documento firmado (el JSON de un JWS o el XML), en texto.
        document_id: { type: string }
        document_type: { type: string }
    User:
      type: object
      required: [id, email, name]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
    WorkspaceSummary:
      type: object
      required: [id, name, role, plan, default_country]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        plan:
          {
            type: [string, 'null'],
            description: 'En la nube, el plan (`free`, `pro_starter`…); `null` en una instalación propia.',
          }
        default_country:
          oneOf:
            - $ref: '#/components/schemas/Country'
            - type: 'null'
    Workspace:
      allOf:
        - $ref: '#/components/schemas/WorkspaceSummary'
        - type: object
          required:
            [
              sello_workspace_id,
              closed,
              limits,
              requests_per_minute,
              created_at,
            ]
          properties:
            role:
              description: El de la persona; `null` con una clave.
              oneOf:
                - $ref: '#/components/schemas/Role'
                - type: 'null'
            sello_workspace_id: { type: [string, 'null'] }
            closed:
              {
                type: boolean,
                description: La organización del IdP se borró; el espacio ya no firma.,
              }
            limits: { $ref: '#/components/schemas/Limits' }
            requests_per_minute:
              type: [integer, 'null']
              description: |
                Las firmas por minuto que el espacio se puso, por debajo de
                `limits.requests_per_minute`; `null` es el del plan.
            created_at: { type: string, format: date-time }
    Limits:
      type: object
      description: |
        Los límites del plan, que el API aplica; `null` es sin límite. En la
        nube, los que empuja billing. En un espacio sin plan (una instalación
        propia), los que la consola le puso (`api workspace limits`) y, donde
        no le puso, los de la instalación (`SIGN_RATE_LIMIT_PER_MINUTE` y
        `SIGN_LOG_RETENTION_DAYS`).

        - `organizations`: las que el espacio puede tener (crear o traer una
          más es `409 organization-limit-reached`).
        - `prod_signatures` y `test_signatures`: las firmas del mes, por
          ambiente; `prod_hard_cap` y `test_hard_cap`, donde se rechaza la
          siguiente (`429 monthly-limit-reached`). En un plan de pago, las de
          producción siguen hasta el doble y se cobran como excedente, y las
          de prueba, hasta un 10 % más, sin cobrarse; sin tope, el tope es la
          cuota. Cuenta lo que firma el espacio, también con organizaciones
          delegadas.
        - `members`: los asientos que admite.
        - `requests_per_minute`: el techo de sus firmas por minuto
          (`429 rate-limited`).
        - `retention_days`: los días que el registro de firmas guarda lo que
          firmó el espacio; después se borra (cada hora). `null`, sin plazo.
      required:
        [
          organizations,
          prod_signatures,
          test_signatures,
          members,
          requests_per_minute,
          retention_days,
          prod_hard_cap,
          test_hard_cap,
        ]
      properties:
        organizations: { type: [integer, 'null'] }
        prod_signatures: { type: [integer, 'null'] }
        test_signatures: { type: [integer, 'null'] }
        members: { type: [integer, 'null'] }
        requests_per_minute: { type: [integer, 'null'] }
        retention_days: { type: [integer, 'null'] }
        prod_hard_cap: { type: [integer, 'null'] }
        test_hard_cap: { type: [integer, 'null'] }
    Member:
      type: object
      required: [user_id, email, name, role]
      properties:
        user_id:
          {
            type: [string, 'null'],
            description: 'El usuario del panel; `null` para quien billing empujó y todavía no entró.',
          }
        email: { type: [string, 'null'] }
        name: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/Role' }
    InvitedBy:
      type: object
      required: [user_id, email, name]
      properties:
        user_id: { type: string, description: El usuario del panel que invitó. }
        email: { type: [string, 'null'] }
        name: { type: [string, 'null'] }
    Invitation:
      type: object
      required: [id, email, role, status, invited_by, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email:
          {
            type: string,
            description: 'En minúsculas: se compara con el de la cuenta que la acepta.',
          }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [pending, expired] }
        invited_by: { $ref: '#/components/schemas/InvitedBy' }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    InvitationToken:
      type: object
      required: [token]
      properties:
        token:
          {
            type: string,
            description: 'El de la invitación (`sign_inv_…`), del enlace del correo.',
          }
    InvitationLookup:
      type: object
      required:
        [
          workspace_id,
          workspace_name,
          email,
          role,
          status,
          invited_by,
          expires_at,
        ]
      properties:
        workspace_id: { type: string, format: uuid }
        workspace_name: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [pending, expired, accepted] }
        invited_by: { $ref: '#/components/schemas/InvitedBy' }
        expires_at: { type: string, format: date-time }
    SelloOrganization:
      type: object
      required: [id, name, country, role, status, workspace_id, max_members]
      properties:
        id: { type: string }
        name: { type: string }
        country: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status:
          type: string
          enum: [open, available, ask, full, closed]
          description: |
            `open`: tiene espacio y la persona es miembro; `available`: no
            tiene y la persona puede abrirlo; `ask`: no tiene y solo quien la
            administra lo abre; `full`: el plan no admite a la persona;
            `closed`: se borró en el IdP.
        workspace_id: { type: [string, 'null'], format: uuid }
        max_members: { type: [integer, 'null'] }
    Usage:
      type: object
      required: [plan, limits, items]
      properties:
        plan: { type: [string, 'null'] }
        limits: { $ref: '#/components/schemas/Limits' }
        items:
          type: array
          items:
            type: object
            required: [month, environment, signatures]
            properties:
              month: { type: string, example: '2026-11' }
              environment: { $ref: '#/components/schemas/Environment' }
              signatures: { type: integer }
    CertificateSummary:
      type: object
      required:
        [
          id,
          environment,
          tax_id,
          subject,
          issuer,
          serial,
          not_before,
          not_after,
          active,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        environment: { $ref: '#/components/schemas/Environment' }
        tax_id: { type: [string, 'null'] }
        subject: { type: string }
        issuer: { type: string }
        serial: { type: string }
        not_before: { type: [string, 'null'], format: date-time }
        not_after: { type: [string, 'null'], format: date-time }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
    Certificate:
      $ref: '#/components/schemas/CertificateSummary'
    OrganizationInput:
      type: object
      required: [name, tax_id, country]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        tax_id: { type: string, minLength: 1, maxLength: 40 }
        country: { $ref: '#/components/schemas/Country' }
        contact_email: { type: [string, 'null'], format: email }
        sello_workspace_id: { type: [string, 'null'] }
    Organization:
      type: object
      required:
        [
          id,
          workspace_id,
          name,
          tax_id,
          country,
          contact_email,
          relation,
          sello_workspace_id,
          delegation,
          certificates,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        workspace_id:
          { type: string, format: uuid, description: El espacio dueño. }
        name: { type: string }
        tax_id: { type: string }
        country: { $ref: '#/components/schemas/Country' }
        contact_email: { type: [string, 'null'] }
        relation: { type: string, enum: [owned, delegated] }
        sello_workspace_id: { type: [string, 'null'] }
        delegation:
          description: Con `relation` = `delegated`, lo que la delegación deja hacer; si no, `null`.
          oneOf:
            - type: object
              required: [id, scopes, locked]
              properties:
                id: { type: string, format: uuid }
                scopes:
                  type: array
                  items: { $ref: '#/components/schemas/DelegationScope' }
                locked: { type: boolean }
            - type: 'null'
        certificates:
          type: object
          description: El certificado activo de cada ambiente.
          required: [test, prod]
          properties:
            test:
              oneOf:
                - $ref: '#/components/schemas/CertificateSummary'
                - type: 'null'
            prod:
              oneOf:
                - $ref: '#/components/schemas/CertificateSummary'
                - type: 'null'
        created_at: { type: string, format: date-time }
    Delegation:
      type: object
      required: [id, workspace_id, workspace_name, scopes, locked, created_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        workspace_name: { type: string }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/DelegationScope' }
        locked: { type: boolean }
        created_at: { type: string, format: date-time }
    ApiKey:
      type: object
      required:
        [
          id,
          name,
          environment,
          scopes,
          organization_id,
          prefix,
          requests_per_minute,
          last_used_at,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        environment: { $ref: '#/components/schemas/Environment' }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/Scope' }
        organization_id: { type: [string, 'null'], format: uuid }
        prefix:
          {
            type: string,
            description: 'El comienzo de la clave, para reconocerla: `sign_test_3kq9AbCd`.',
          }
        requests_per_minute:
          type: [integer, 'null']
          description: Las firmas por minuto de la clave, además de las del espacio; `null`, sin límite propio.
        last_used_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    SignatureEntry:
      type: object
      required:
        [
          id,
          organization_id,
          organization_name,
          environment,
          document_id,
          document_type,
          api_key_id,
          user_id,
          signed_by_workspace_id,
          duration_ms,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        organization_name:
          {
            type: [string, 'null'],
            description: '`null` si la organización se borró.',
          }
        environment: { $ref: '#/components/schemas/Environment' }
        document_id: { type: string }
        document_type: { type: string }
        api_key_id: { type: [string, 'null'], format: uuid }
        user_id:
          { type: [string, 'null'], description: Quien firmó desde el panel. }
        signed_by_workspace_id: { type: string, format: uuid }
        duration_ms: { type: integer }
        created_at: { type: string, format: date-time }
    AuditAction:
      type: string
      description: |
        `<objeto>.<verbo>`, estable. Lo que dice cada una en `details`:

        - `workspace.created` (`name`, `default_country`; en la nube,
          `sello_workspace_id` y `plan`), `workspace.updated` (`changes`:
          `name`, `default_country`, `requests_per_minute`),
          `workspace.limits_changed` (la consola, en un espacio sin plan;
          `changes` con los límites), `workspace.plan_changed` (billing;
          `changes` con `plan` y los límites), `workspace.closed` y
          `workspace.reopened` (billing), `workspace.exported`.
        - `member.added` (la consola; `role`), `member.role_changed`
          (`from`, `to`), `member.removed` y `member.left` (`role`; al
          borrar la cuenta, también `account_deleted: true`).
        - `invitation.created`, `invitation.renewed`, `invitation.revoked`
          (`role`) e `invitation.accepted` (`role`, y `joined: false` si la
          persona ya era miembro).
        - `organization.created` (`tax_id`, `country`, `contact_email`,
          `sello_workspace_id`), `organization.updated` (`changes`: `name`,
          `contact_email`, `sello_workspace_id`), `organization.deleted`
          (`tax_id`, `country`, `certificates`), `organization.claimed` y
          `organization.returned` (`tax_id`, `country`, `from_workspace_id`,
          `from_workspace_name`, `to_workspace_id`).
        - `certificate.uploaded` (`organization_id`, `environment`,
          `serial`, `not_after`, `active` y, si reemplazó al activo,
          `replaced_certificate_id`), `certificate.activated` y
          `certificate.deactivated` (lo mismo, sin `active`),
          `certificate.deleted` (con `active`).
        - `delegation.granted` y `delegation.removed` (`organization_id`,
          `owner_workspace_id`, `owner_workspace_name`, `workspace_id` y
          `workspace_name` del espacio delegado, `scopes`, `locked`; al
          quitarla, `renounced`: si fue el delegado).
        - `api_key.created` (`environment`, `scopes`, `organization_id`,
          `requests_per_minute`) y `api_key.revoked` (`environment`,
          `organization_id` y, si no la revocó nadie, `reason`:
          `organization_deleted` u `organization_returned`).
      enum:
        - workspace.created
        - workspace.updated
        - workspace.limits_changed
        - workspace.plan_changed
        - workspace.closed
        - workspace.reopened
        - workspace.exported
        - member.added
        - member.role_changed
        - member.removed
        - member.left
        - invitation.created
        - invitation.renewed
        - invitation.revoked
        - invitation.accepted
        - organization.created
        - organization.updated
        - organization.deleted
        - organization.claimed
        - organization.returned
        - certificate.uploaded
        - certificate.activated
        - certificate.deactivated
        - certificate.deleted
        - delegation.granted
        - delegation.removed
        - api_key.created
        - api_key.revoked
    AuditActorType:
      type: string
      description: |
        `user`: una persona, con el token. `api_key`: una clave (por el API
        o, con `via: mcp`, por el servidor MCP). `billing`: billing de
        Sello (la nube). `console`: la consola del servidor. `workspace`:
        otro espacio, en lo que hizo a lo que este guarda. `system`: el API
        mismo.
      enum: [user, api_key, billing, console, workspace, system]
    AuditTargetType:
      type: string
      enum:
        [
          workspace,
          member,
          invitation,
          organization,
          certificate,
          delegation,
          api_key,
        ]
    AuditEvent:
      type: object
      required: [id, action, actor, target, details, created_at]
      properties:
        id: { type: string, format: uuid }
        action: { $ref: '#/components/schemas/AuditAction' }
        actor:
          type: object
          description: Quién, como lo conocía el API en ese momento.
          required: [type, id, email, name, via]
          properties:
            type: { $ref: '#/components/schemas/AuditActorType' }
            id:
              type: [string, 'null']
              description: El `user_id` de la persona, el id de la clave o el del espacio; `null` para billing, la consola y el sistema.
            email:
              type: [string, 'null']
              description: El de la persona, según su token.
            name:
              type: [string, 'null']
              description: El de la persona (según su token), el de la clave o el del espacio.
            via:
              type: [string, 'null']
              enum: [mcp, null]
              description: '`mcp` si una clave lo hizo por el servidor MCP.'
        target:
          type: object
          required: [type, id, label]
          properties:
            type: { $ref: '#/components/schemas/AuditTargetType' }
            id:
              type: [string, 'null']
              description: El id del espacio, de la organización, del certificado, de la delegación, de la clave o de la invitación; el `user_id` de un miembro.
            label:
              type: string
              description: Su nombre en ese momento (el de la organización, también para sus certificados y delegaciones; el de la clave; el correo del miembro o de la invitación); vacío si no se conocía.
        details:
          type: object
          description: Lo que cambió (ver `AuditAction`). Nunca un secreto.
        created_at: { type: string, format: date-time }
    AccountDeletion:
      type: object
      required: [allowed, workspaces]
      properties:
        allowed:
          type: boolean
          description: Si `DELETE /me` borraría ahora la cuenta.
        workspaces:
          type: array
          items:
            type: object
            required: [id, name, role, members, organizations, outcome]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              role: { $ref: '#/components/schemas/Role' }
              members: { type: integer }
              organizations: { type: integer }
              outcome:
                type: string
                enum: [leave, delete, transfer, delegated]
                description: |
                  `leave`: la persona sale. `delete`: es su único miembro y se
                  borra con todo lo suyo. `transfer`: es su único propietario y
                  hay otros miembros; antes hay que hacer propietario a otro.
                  `delegated`: es su único miembro, pero otros espacios usan
                  sus organizaciones por delegación; antes hay que quitarlas.
                  Los dos últimos impiden borrar la cuenta.
    WorkspaceExport:
      type: object
      required:
        [
          format,
          exported_at,
          workspace,
          organizations,
          api_keys,
          members,
          invitations,
          usage,
          audit_events,
          signatures,
        ]
      properties:
        format: { type: string, const: sello-sign-export/1 }
        exported_at: { type: string, format: date-time }
        workspace: { $ref: '#/components/schemas/Workspace' }
        organizations:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Organization'
              - type: object
                required: [certificates, active_certificates, delegations]
                properties:
                  certificates:
                    type: [array, 'null']
                    description: Todos, solo sus datos públicos; `null` si la delegación no deja leerlos.
                    items: { $ref: '#/components/schemas/Certificate' }
                  active_certificates:
                    description: Lo que `Organization` llama `certificates`.
                  delegations:
                    type: [array, 'null']
                    description: Las que dio una organización propia; `null` en una delegada.
                    items: { $ref: '#/components/schemas/Delegation' }
        api_keys:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ApiKey'
              - type: object
                required: [created_by, revoked_at]
                properties:
                  created_by: { type: [string, 'null'] }
                  revoked_at: { type: [string, 'null'], format: date-time }
        members:
          type: array
          items: { $ref: '#/components/schemas/Member' }
        invitations:
          type: array
          items: { $ref: '#/components/schemas/Invitation' }
        usage:
          type: array
          items:
            type: object
            required: [month, environment, signatures]
            properties:
              month: { type: string, example: '2026-11' }
              environment: { $ref: '#/components/schemas/Environment' }
              signatures: { type: integer }
        audit_events:
          type: array
          description: El registro de actividad, del más nuevo al más antiguo; el primero es esta exportación.
          items: { $ref: '#/components/schemas/AuditEvent' }
        signatures:
          type: array
          items: { $ref: '#/components/schemas/SignatureEntry' }
    BillingState:
      type: object
      description: '`SignStateBody` de `cmd/billing` de Sello.'
      required: [workspace_id, version, plan, limits]
      properties:
        workspace_id: { type: string }
        version: { type: integer }
        closed: { type: boolean }
        name: { type: string }
        country: { type: [string, 'null'] }
        members:
          type: array
          items:
            type: object
            required: [account, role]
            properties:
              account:
                { type: string, description: El `sub` de la cuenta Sello. }
              role: { type: string, enum: [OWNER, ADMIN, MEMBER] }
        plan:
          type: string
          enum:
            [FREE, PRO_STARTER, PRO_GROWTH, PRO_SCALE, PRO_BUSINESS, ENTERPRISE]
        limits:
          type: object
          properties:
            issuers: { type: [integer, 'null'] }
            prod_signatures: { type: [integer, 'null'] }
            test_signatures: { type: [integer, 'null'] }
            members: { type: [integer, 'null'] }
            requests_per_minute: { type: [integer, 'null'] }
            retention_days: { type: [integer, 'null'] }
        hard_caps:
          type: object
          properties:
            prod: { type: [integer, 'null'] }
            test: { type: [integer, 'null'] }
        subscription:
          type: [object, 'null']
          properties:
            status: { type: string }
            interval: { type: [string, 'null'] }
            current_period_end: { type: [string, 'null'], format: date-time }
            cancel_at_period_end: { type: boolean }
